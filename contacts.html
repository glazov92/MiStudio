<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script>
    (function () {
        if (!/\.github\.io$/i.test(location.hostname)) return;
        var first = location.pathname.split('/').filter(Boolean)[0];
        if (!first || /\./.test(first)) return;
        document.write('<base href="/' + first.replace(/"/g, '') + '/">');
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — Mi Studio</title>
    <meta name="description" content="Контакты студии красоты «Mi Studio»: адрес, телефоны, часы работы, как добраться.">
    <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
    <link href="https://fonts.bunny.net/css?family=onest:300,400,500,600,700|space-grotesk:400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.1/styles/overlayscrollbars.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contacts">

    <div id="header"></div>

    <main>
        <section class="section">
            <div class="container">
                <div class="section__head">
                    <span class="section__dot"></span>
                    <h1 class="section__title">Контакты</h1>
                </div>
                <p class="section__sub">Позвоните, напишите нам или оставьте заявку — подберём удобное время.</p>

                <div class="contacts__grid" style="margin-top:28px">
                    <div class="contact-card">
                        <div class="contact-card__icon">

                        </div>
                        <div>
                            <span class="contact-card__label">Адрес</span>
                            <span class="contact-card__value" id="c-address"></span>
                        </div>
                    </div>

                    <div class="contact-card">
                        <div class="contact-card__icon">
                            <svg width="20" height="20" viewBox="0 0 512 512"><path fill="currentColor" d="M497 39.2L479.7 8.2c-3.2-4.5-8.2-7.1-13.6-7.2-5.3-.1-10.4 2.2-13.8 6.5l-70.6 88.9c-4.4 5.5-5.8 12.7-3.6 19.5l38 92.3c-16.2 82-76.4 141.4-157.4 157.3l-91.5-37.9c-6.8-2.8-14.3-1.4-19.7 3.6l-89.4 70.9c-4.3 3.4-6.7 8.5-6.7 13.9-.1 5.3 2.2 10.4 6.4 13.9L78 481c4.7 4 42 34.7 92.9 34.7 6 0 12.1-.3 18.2-.9 69.4-6.7 152.8-43.2 226.2-116.6 81.5-81.6 120.7-183.2 104.9-264.9L497.3 54c3.5-8.3 3.2-13.3-.3-14.8z"/></svg>
                        </div>
                        <div>
                            <span class="contact-card__label">Телефоны</span>
                            <a class="contact-card__value" id="c-phone1" href="#"></a>
                            <a class="contact-card__value" id="c-phone2" href="#"></a>
                        </div>
                    </div>

                    <div class="contact-card">
                        <div class="contact-card__icon">
                            <svg width="20" height="20" viewBox="0 0 512 512"><path fill="currentColor" d="M256 0a256 256 0 1 0 0 512A256 256 0 1 0 256 0zm46.4 348.9c-9.2 4.6-23.2 6.5-36.8 6.5-32.6 0-55.3-12.2-65.4-19.9l-19.4 13.5 9.4-23.5s12.4-18.8 21.5-31.6c-9.7-12.6-16.6-29.2-16.6-47.2 0-44.6 39.2-80.8 87.6-80.8 48.4 0 87.6 36.2 87.6 80.8 0 47.8-36.4 86-48.6 100.7-5.7 6.7-11.7 10.6-18.9 12.5zm-5.5-126.9c-14.1 0-25.5 10.4-25.5 23.3s11.4 23.3 25.5 23.3 25.5-10.4 25.5-23.3-11.4-23.3-25.5-23.3zm-88.9-8.7c-9.9 0-18-7.3-18-16.3s8.1-16.3 18-16.3 18 7.3 18 16.3-8.1 16.3-18 16.3zm22.2 69.5c-9.9 0-18-7.3-18-16.3s8.1-16.3 18-16.3 18 7.3 18 16.3-8.1 16.3-18 16.3z"/></svg>
                        </div>
                        <div>
                            <span class="contact-card__label">Часы работы</span>
                            <span class="contact-card__value" id="c-schedule"></span>
                        </div>
                    </div>

                    <div class="contact-card">
                        <div class="contact-card__icon">
                            <svg width="20" height="20" viewBox="0 0 448 512"><path fill="currentColor" d="M446.7 98.6l-67.6 318.8c-5.1 22.5-18.4 28.1-37.3 17.5l-103-75.9-49.7 47.8c-5.5 5.5-10.1 10.1-20.7 10.1l7.4-104.9 190.9-172.5c8.3-7.4-1.8-11.5-12.9-4.1L117.8 284 16.2 252.2c-22.1-6.9-22.5-22.1 4.6-32.7L418.2 66.4c18.4-6.9 34.5 4.1 28.5 32.2z"/></svg>
                        </div>
                        <div>
                            <span class="contact-card__label">Мы в соцсетях</span>
                            <span class="contact-card__value">VK · Telegram</span>
                        </div>
                    </div>
                </div>

                <div class="socials" style="margin-bottom:40px" id="home-socials"></div>

                <button class="btn btn--accent" data-open-popup style="margin-bottom:40px">Связаться</button>

                <div class="map">
                    <iframe id="c-map" title="Mi Studio на карте" loading="lazy" allowfullscreen></iframe>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>
    <div id="popup-root"></div>
    <div id="float-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.1/browser/overlayscrollbars.browser.es6.min.js"></script>
    <script src="config.js?v=20260816-3"></script>
    <script src="js/data.js?v=20260816-3"></script>
    <script src="js/main.js?v=20260816-3"></script>
</body>
</html>
