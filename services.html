    <script>
    (function () {
        if (!/\.github\.io$/i.test(location.hostname)) return;
        var first = location.pathname.split('/').filter(Boolean)[0];
        if (!first || /\./.test(first)) return;
        document.write('<base href="/' + first.replace(/"/g, '') + '/">');
    })();
    </script>
