name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APKs
        run: gradle -p android assembleRelease assembleDebug --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/MiStudio-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/MiStudio-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiStudio-apk
          path: out/*.apk

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/MiStudio-release.apk
