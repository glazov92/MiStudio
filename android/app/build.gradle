plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.studiomi.app'
    compileSdk 35

    defaultConfig {
        applicationId "ru.studiomi.app"
        minSdk 24
        targetSdk 35
        versionCode 16
        versionName "2.4.2"
    }

    signingConfigs {
        release {
            storeFile rootProject.file('signing/mistudio.p12')
            storePassword 'ms1d43b1172609be9a52ddc2b2'
            keyAlias 'mistudio'
            keyPassword 'ms1d43b1172609be9a52ddc2b2'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'kotlin-stdlib >=1.8 merges jdk7/jdk8 artifacts'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'kotlin-stdlib >=1.8 merges jdk7/jdk8 artifacts'
        }
    }
}
